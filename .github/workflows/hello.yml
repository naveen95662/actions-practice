name: Hello World

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: Print a greeting
        run: echo "Hello from GitHub Actions!"

      - name: Show Python version
        run: python --versi

      - name: Show who triggered this
        run: echo "Triggered by ${{ github.actor }} on branch ${{ github.ref_name }}"
